# Online GRPO Training Configuration

# Training
num_epochs: 1
train_batch_size: 32
ppo_mini_batch_size: 16
rollout_n: 8
temperature: 1.0
seed: 1029
# Increase micro batch sizes for better GPU utilization
ppo_micro_batch_size_per_gpu: 32  # Process 32 samples at once during training
log_prob_micro_batch_size_per_gpu: 32  # Process 32 samples at once during rollout
adv_estimator: grpo
use_kl_in_reward: false
actor_lr: 1.0e-6

# Environment
max_questions_per_case: 200
coverage_threshold: 0.98
critical_coverage_threshold: 1.0
training_probe_window: 12
validation_questions_per_case: 20
coverage_route_attempts: 16
coverage_random_exploration_ratio: 0.15
tau: 0.55  # Dense add/merge similarity threshold
top_k: 8
top_k_points: 32
regression_sample_size: 12
commit_threshold: 1.0  # Commit only if completeness-gated reward is clearly positive
initial_defense_use_llm: false  # Online training should not call answer-agent APIs in the dataloader.
initial_defense_judge_use_llm: false  # Keep online dataloader off external judge APIs.

# UnifiedMem-style non graph-based retrieval
retriever:
  type: dense_structured
  embedding_model: contriever
  model_name: /mnt/local2/wxy/models/contriever
  retrieval_mode: flatten
  max_length: 256
  fields: ["facts", "summary", "keywords", "content"]
  device: cpu  # Avoid loading one Contriever copy per reward worker onto the actor/vLLM GPU.
  require_model: true  # Formal training should fail fast instead of falling back to hash retrieval.

# Reward shaping. Default avoids per-rollout LLM calls but checks relation/fact
# completeness. Set mode: evaluation_aligned to call the retrieved-memory answer
# agent + judge inside the reward worker.
reward_config:
  mode: semantic_complete
  min_relation_overlap: 0.50
  min_fact_overlap: 0.50
  min_non_answer_tokens: 5
  min_structured_entity_coverage: 0.80
  min_structured_relation_coverage: 0.50
  min_qualifier_overlap: 0.50
  weights:
    current_correct: 3.0
    current_wrong: -3.0
    completeness: 2.0
    completeness_missing: 2.0
    grounded: 1.0
    regression_accuracy: 1.25
    regression_failure: 2.0
    chunk_count: 0.3
    tokens_per_100: 0.35
    duplicate: 0.75
    answer_only: 1.5
    raw_copy: 1.0
    coverage_gain: 1.5
    critical_coverage_gain: 1.0

# Attack generation
routing_policy: "random_walk"
routing_max_steps: 4
routing_min_nodes: 1
routing_attempts: 12
routing_seed_offset: 10000
max_attack_attempts: 20
attacker_llm: "/mnt/local2/wxy/models/Qwen3-0.6B"  # Model name that vLLM server serves
attacker_api_base: "http://localhost:8003/v1"  # Local vLLM server endpoint
attacker_api_key: ""  # Set ATTACKER_API_KEY at runtime when the local server requires authentication.

# Model
model_dtype: bfloat16  # Required for Flash Attention 2; use float16 if your GPU lacks bf16.
rollout_dtype: bfloat16
attn_implementation: flash_attention_2
infer_backend: vllm
rollout_tp: 1
rollout_gpu_memory_utilization: 0.8
max_prompt_length: 8192
max_response_length: 4096

# Logging
log_interval: 10
save_freq: 100  # verl model checkpoint frequency
test_freq: 500
memory_checkpoint_interval: 100
memory_save_interval: 20
memory_trajectory_enabled: true
memory_trajectory_dir: "memory_trajectory"
reward_num_workers: 8  # Increase parallel reward workers for faster computation
reward_manager: naive
use_v1: true
project_name: memory_refactor_grpo_online
experiment_name: online_training
trainer_logger: ["console", "wandb"]
n_gpus_per_node: 1
nnodes: 1
