# Online GRPO Training Configuration

# Training
num_epochs: 6
train_batch_size: 8
ppo_mini_batch_size: 4
rollout_n: 8
temperature: 1.0
seed: 42

# Environment
episodes_per_case: 500
tau: 0.55  # Dense add/merge similarity threshold
top_k: 8
top_k_points: 24
regression_sample_size: 8
commit_threshold: 1.0  # Commit only if completeness-gated reward is clearly positive

# UnifiedMem-style non graph-based retrieval
retriever:
  type: dense_structured
  embedding_model: contriever
  model_name: facebook/contriever
  retrieval_mode: flatten
  top_k_points: 24
  fields: ["facts", "summary", "keywords", "content"]
  device: cpu
  require_model: false  # If false, fallback to deterministic hashed dense retrieval when HF model is unavailable.

# Reward shaping. Default avoids per-rollout LLM calls but checks relation/fact
# completeness. Set mode: evaluation_aligned to call the retrieved-memory answer
# agent + judge inside the reward worker.
reward_config:
  mode: semantic_complete
  min_relation_overlap: 0.25
  min_fact_overlap: 0.25
  min_non_answer_tokens: 3
  weights:
    current_correct: 3.0
    current_wrong: -3.0
    completeness: 2.0
    completeness_missing: 2.0
    grounded: 1.0
    regression_accuracy: 1.25
    regression_failure: 2.0
    chunk_count: 0.2
    tokens_per_100: 0.15
    duplicate: 0.5
    answer_only: 1.5
    raw_copy: 0.5

# Attack generation
routing_policy: "random_walk"
routing_max_steps: 3
routing_min_nodes: 1
routing_attempts: 8
routing_seed_offset: 10000
max_attack_attempts: 10
attacker_llm: "/mnt/local2/wxy/models/Qwen3-0.6B"  # Model name that vLLM server serves
attacker_api_base: "http://localhost:8003/v1"  # Local vLLM server endpoint
attacker_api_key: "dyz1029"  # API key for local vLLM server

# Model
model_dtype: bfloat16  # Required for Flash Attention 2; use float16 if your GPU lacks bf16.
rollout_dtype: bfloat16
attn_implementation: flash_attention_2
max_prompt_length: 8192
max_response_length: 768

# Logging
log_interval: 10
save_freq: 250  # verl model checkpoint frequency
checkpoint_interval: 250
memory_save_interval: 1
memory_trajectory_enabled: true
memory_trajectory_dir: "memory_trajectory"
reward_num_workers: 4
use_v1: true

# verl-specific settings (passed to verl trainer)
verl:
  algorithm:
    adv_estimator: grpo
    use_kl_in_reward: false

  actor_rollout_ref:
    model:
      # model.path set via command line
      ppo_mini_batch_size: 4
      ppo_micro_batch_size_per_gpu: 1
      override_config:
        attn_implementation: flash_attention_2

    actor:
      fsdp_config:
        model_dtype: bfloat16
      optim:
        lr: 1.0e-6

    rollout:
      name: vllm
      dtype: bfloat16
      tensor_model_parallel_size: 1
      gpu_memory_utilization: 0.6
      log_prob_micro_batch_size_per_gpu: 1
      n: 8  # Must match rollout_n above
      temperature: 1.0

    ref:
      fsdp_config:
        model_dtype: bfloat16
      log_prob_micro_batch_size_per_gpu: 1

  reward:
    reward_manager:
      name: naive
    custom_reward_function:
      # Set dynamically in code
      path: ""
      name: compute_score

  trainer:
    project_name: memory_refactor_grpo_online
    experiment_name: online_training
    logger: ["console", "wandb"]
    n_gpus_per_node: 1
    nnodes: 1
    total_epochs: 6
    save_freq: 250
    test_freq: 250
