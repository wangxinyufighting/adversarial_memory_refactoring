# Co-Training V2 Configuration

cotrain_rounds: 5

# Attacker Training Phase
attacker:
  # Model
  model_path: /mnt/local2/wxy/models/Qwen3-0.6B
  model_dtype: bfloat16
  rollout_dtype: bfloat16
  attn_implementation: flash_attention_2

  # Training
  num_epochs: 1
  train_batch_size: 16
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 2
  rollout_n: 8
  temperature: 1.0
  actor_lr: 1.0e-6
  episodes_per_case: 100

  # Routing
  routing_policy: random_walk
  routing_attempts: 12
  routing_min_nodes: 1
  routing_max_steps: 4

  # Reward weights
  reward_weights:
    format: 1.0
    difficulty: 2.0
    constructive: 3.0

  # Difficulty bandpass (Dr. Zero style)
  difficulty_target:
    p_low: 0.25
    p_high: 0.75
    sigma: 0.12

  # HRPO grouping
  use_hrpo: true

  # Rollout
  infer_backend: vllm
  rollout_tp: 1
  rollout_gpu_memory_utilization: 0.6
  log_prob_micro_batch_size_per_gpu: 2
  max_prompt_length: 4096
  max_response_length: 512

  # Infrastructure
  reward_manager: naive
  reward_num_workers: 4
  n_gpus_per_node: 1
  nnodes: 1

  # Logging
  project_name: cotrain_v2
  experiment_name: attacker_training
  trainer_logger: [console, wandb]
  use_v1: true
  save_freq: 100
  test_freq: 500

# Defender Training Phase
defender:
  # Model (same as current online_grpo.yaml)
  model_dtype: bfloat16
  rollout_dtype: bfloat16
  attn_implementation: flash_attention_2

  # Training
  num_epochs: 10
  train_batch_size: 32
  ppo_mini_batch_size: 16
  ppo_micro_batch_size_per_gpu: 32
  rollout_n: 8
  temperature: 1.0
  actor_lr: 1.0e-6
  log_prob_micro_batch_size_per_gpu: 32

  # Environment
  max_questions_per_case: 200
  coverage_threshold: 0.98
  critical_coverage_threshold: 1.0
  training_probe_window: 12
  validation_questions_per_case: 20
  coverage_route_attempts: 16
  coverage_random_exploration_ratio: 0.15
  tau: 0.55
  top_k: 8
  top_k_points: 32
  regression_sample_size: 12
  commit_threshold: 1.0
  initial_defense_use_llm: false
  initial_defense_judge_use_llm: false

  # Retriever
  retriever:
    type: dense_structured
    embedding_model: contriever
    model_name: /mnt/local2/wxy/models/contriever
    retrieval_mode: flatten
    max_length: 256
    fields: [facts, summary, keywords, content]
    device: cpu
    require_model: true

  # Reward config
  reward_config:
    mode: semantic_complete
    min_relation_overlap: 0.50
    min_fact_overlap: 0.50
    min_non_answer_tokens: 5
    min_structured_entity_coverage: 0.80
    min_structured_relation_coverage: 0.50
    min_qualifier_overlap: 0.50
    weights:
      current_correct: 3.0
      current_wrong: -3.0
      completeness: 2.0
      completeness_missing: 2.0
      grounded: 1.0
      regression_accuracy: 1.25
      regression_failure: 2.0
      chunk_count: 0.3
      tokens_per_100: 0.35
      duplicate: 0.75
      answer_only: 1.5
      raw_copy: 1.0
      coverage_gain: 2.0  # Increased for co-training
      critical_coverage_gain: 1.0

  # Attack generation (will use trained attacker in future)
  routing_policy: random_walk
  routing_max_steps: 4
  routing_min_nodes: 1
  routing_attempts: 12
  routing_seed_offset: 10000
  max_attack_attempts: 20
  attacker_llm: /mnt/local2/wxy/models/Qwen3-0.6B
  attacker_api_base: http://localhost:8003/v1
  attacker_api_key: ""

  # Rollout
  infer_backend: vllm
  rollout_tp: 1
  rollout_gpu_memory_utilization: 0.6
  max_prompt_length: 8192
  max_response_length: 4096

  # Infrastructure
  reward_manager: naive
  reward_num_workers: 8
  n_gpus_per_node: 1
  nnodes: 1

  # Logging
  log_interval: 10
  save_freq: 100
  test_freq: 500
  memory_checkpoint_interval: 100
  memory_save_interval: 20
  memory_trajectory_enabled: false  # Disable for faster training
  project_name: cotrain_v2
  experiment_name: defender_training
  trainer_logger: [console, wandb]
  use_v1: true

# Evaluation
evaluation:
  eval_every_round: 1
  val_questions_per_case: 20
  target_accuracy_threshold: 0.85
  target_compression_ratio: 0.3
